<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        .error { color: red; font-size: 14px; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>Registration Form</h2>
    
    <form name="registrationForm" onsubmit="return validateForm()">
        <label>Full Name:</label>
        <input type="text" id="name" name="name">
        <span id="nameError" class="error"></span><br><br>
        
        <label>Email:</label>
        <input type="email" id="email" name="email">
        <span id="emailError" class="error"></span><br><br>
        
        <label>Password:</label>
        <input type="password" id="password" name="password">
        <span id="passwordError" class="error"></span><br><br>
        
        <label>Phone:</label>
        <input type="text" id="phone" name="phone">
        <span id="phoneError" class="error"></span><br><br>
        
        <label>Course:</label>
        <input type="text" id="course" name="course">
        <span id="courseError" class="error"></span><br><br>
        
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
    
    <div id="successMessage" class="success"></div>

    <script>
        function validateForm() {
            var isValid = true;
            
            // Clear previous errors
            document.getElementById("nameError").innerHTML = "";
            document.getElementById("emailError").innerHTML = "";
            document.getElementById("passwordError").innerHTML = "";
            document.getElementById("phoneError").innerHTML = "";
            document.getElementById("courseError").innerHTML = "";
            document.getElementById("successMessage").innerHTML = "";
            
            // Get values
            var name = document.getElementById("name").value.trim();
            var email = document.getElementById("email").value.trim();
            var password = document.getElementById("password").value.trim();
            var phone = document.getElementById("phone").value.trim();
            var course = document.getElementById("course").value.trim();
            
            // Validate Name
            if (name === "") {
                document.getElementById("nameError").innerHTML = "Name is required!";
                isValid = false;
            }
            
            // Validate Email
            if (email === "") {
                document.getElementById("emailError").innerHTML = "Email is required!";
                isValid = false;
            }
            
            // Validate Password
            if (password === "") {
                document.getElementById("passwordError").innerHTML = "Password is required!";
                isValid = false;
            }
            
            // Validate Phone
            if (phone === "") {
                document.getElementById("phoneError").innerHTML = "Phone is required!";
                isValid = false;
            }
            
            // Validate Course
            if (course === "") {
                document.getElementById("courseError").innerHTML = "Course is required!";
                isValid = false;
            }
            
            if (isValid) {
                document.getElementById("successMessage").innerHTML = "✅ Registration successful!";
                // You can submit the form or send data to server
                // return true; // Uncomment to submit form
            }
            
            return false; // Prevent form submission for demo
        }
    </script>
</body>
</html>
